[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce-intelligence-platform"
version = "0.1.0"
description = "AI-native commerce intelligence and decision platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg2-binary>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.setuptools]
packages = []